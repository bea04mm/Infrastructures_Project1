services:
  nginx:
    image: nginx:alpine
    container_name: nginx_reverse_proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend

  frontend:
    build:
      context: ./frontend
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/event_kiosk
      XIQ_USERNAME: student05@rcsecurenetworks.com
      XIQ_PASSWORD: Training6005
      XIQ_SSID_ID: ""
      XIQ_SSID_NAME: "23787_25262"
      WEBHOOK_URL: "https://suited-quail-thankful.ngrok-free.app/webhooks/authentication"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: kiosk_postgres
    environment:
      POSTGRES_DB: event_kiosk
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d event_kiosk"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata: